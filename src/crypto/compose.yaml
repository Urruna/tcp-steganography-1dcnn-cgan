name: crypto-lab

services:
  selftest:
    build: .
    image: crypto-node:1
    command:
      - sh
      - -c
      - >-
        python crypto_tool.py selftest
        --iterations 200
        --report /app/out/crypto_selftest.json
        && python crypto_tool.py demo --out-dir /app/out
    volumes:
      - ./out:/app/out
